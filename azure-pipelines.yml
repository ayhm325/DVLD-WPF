trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Release'
  DVLD_TEST_CONNECTION: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Connection Timeout=30;'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# ---------------------------------------------------------
# Unit Tests
# ---------------------------------------------------------

- task: DotNetCoreCLI@2
  displayName: 'Run Application Unit Tests'
  inputs:
    command: 'test'
    projects: 'Test/Application.UnitTests/Application.UnitTests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true

# ---------------------------------------------------------
# API Integration Tests
# ---------------------------------------------------------

- task: DotNetCoreCLI@2
  displayName: 'Run API Integration Tests'
  inputs:
    command: 'test'
    projects: 'Test/API.IntegrationTests/API.IntegrationTests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true
  env:
    DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'

# ---------------------------------------------------------
# Infrastructure Integration Tests
# ---------------------------------------------------------

- task: DotNetCoreCLI@2
  displayName: 'Run Infrastructure Integration Tests'
  inputs:
    command: 'test'
    projects: 'Test/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true
  env:
    DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'